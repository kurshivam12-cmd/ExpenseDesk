<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ExpenseDesk – Student Expense Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#eef2f5;--card:#fff;--ink:#14263a;--muted:#5d6f82;--line:#d6dee6;--accent:#0f6b8f;--warn:#e0a100;--bad:#c23b3b;--ok:#2e8b57;--r:10px}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a26;--card:#17273a;--ink:#e8eef4;--muted:#93a5b8;--line:#2b3f55;--accent:#4fb3d9;--warn:#f0b429;--bad:#e56a6a;--ok:#5cc08a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,Segoe UI,sans-serif;line-height:1.5}
header{padding:28px 20px 8px;max-width:1050px;margin:auto}
h1{margin:0;font-size:2rem;font-weight:800;letter-spacing:-.02em}
header p{margin:2px 0 0;color:var(--muted)}
main{max-width:1050px;margin:auto;padding:12px 20px 40px;display:grid;grid-template-columns:320px 1fr;gap:18px}
@media(max-width:800px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
h2{margin:0 0 12px;font-size:1.1rem}
.runway{grid-column:1/-1}
.runway .top{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px}
.left{font-size:2.6rem;font-weight:800;letter-spacing:-.03em;line-height:1}
.left small{display:block;font-size:.9rem;font-weight:400;color:var(--muted);letter-spacing:0;margin-top:6px}
.track{height:14px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:14px}
.fill{height:100%;width:0;background:var(--ok);transition:width .4s,background .3s}
.msg{margin-top:10px;font-size:.92rem;min-height:1.3em}
.budget-row{display:flex;gap:8px;align-items:center}
label{display:block;font-size:.85rem;color:var(--muted);margin:10px 0 4px}
input,select,button{font:inherit;color:inherit}
input,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{cursor:pointer;border:0;border-radius:8px;padding:9px 14px;background:var(--accent);color:#fff;font-weight:600}
button.ghost{background:transparent;color:var(--accent);border:1px solid var(--line);padding:5px 9px;font-weight:400}
button.del{color:var(--bad)}
form button{width:100%;margin-top:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bar{display:grid;grid-template-columns:90px 1fr 80px;gap:8px;align-items:center;font-size:.9rem;margin:7px 0}
.bar div.b{height:10px;border-radius:99px;background:var(--accent)}
.bar span:last-child{text-align:right}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600}
td.amt{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.scroll{overflow-x:auto}
.empty{color:var(--muted);padding:14px 0}
.tools{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.tools select{width:auto}
.stack{display:grid;gap:18px}
</style>
</head>
<body>
<header>
  <h1>ExpenseDesk</h1>
  <p>Track where your money goes, one expense at a time.</p>
</header>

<main>
  <section class="card runway" aria-live="polite">
    <div class="top">
      <div class="left"><span id="leftAmt">₹0</span><small id="leftLabel">Set a monthly budget to see what is left</small></div>
      <div class="budget-row">
        <input id="budgetInput" type="number" min="1" placeholder="Monthly budget (₹)" aria-label="Monthly budget">
        <button id="budgetBtn" type="button">Save budget</button>
      </div>
    </div>
    <div class="track"><div class="fill" id="fill"></div></div>
    <div class="msg" id="msg"></div>
  </section>

  <section class="card">
    <h2 id="formTitle">Add expense</h2>
    <form id="form">
      <label for="amount">Amount (₹)</label>
      <input id="amount" type="number" min="0.01" step="0.01" required>
      <label for="category">Category</label>
      <select id="category">
        <option>Food</option><option>Travel</option><option>Books</option>
        <option>Fees</option><option>Fun</option><option>Other</option>
      </select>
      <label for="date">Date</label>
      <input id="date" type="date" required>
      <label for="note">Note</label>
      <input id="note" type="text" maxlength="60" placeholder="e.g. canteen lunch">
      <button type="submit" id="saveBtn">Add expense</button>
      <button type="button" id="cancelBtn" class="ghost" style="display:none">Cancel edit</button>
    </form>
  </section>

  <div class="stack">
    <section class="card">
      <div class="tools">
        <h2 style="margin:0">Expenses</h2>
        <select id="monthFilter" aria-label="Filter by month"></select>
      </div>
      <div class="scroll"><table>
        <thead><tr><th>Date</th><th>Category</th><th>Note</th><th style="text-align:right">Amount</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table></div>
      <div class="empty" id="empty">No expenses yet. Add your first one on the left.</div>
      <p style="margin:12px 0 0"><strong>Total shown: <span id="total">₹0</span></strong></p>
    </section>

    <section class="card">
      <h2>Spending by category</h2>
      <div id="cats"></div>
    </section>

    <section class="card">
      <h2>Spending by month</h2>
      <div id="months"></div>
    </section>
  </div>
</main>

<script>
(function(){
  var KEY='expensedesk-data';
  var data={expenses:[],budget:0};
  var editId=null;

  function load(){
    try{var s=localStorage.getItem(KEY);if(s){var d=JSON.parse(s);if(d&&Array.isArray(d.expenses))data=d;}}catch(e){}
  }
  function save(){try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}}
  function $(id){return document.getElementById(id);}
  function money(n){return '₹'+Number(n).toLocaleString('en-IN',{maximumFractionDigits:2});}
  function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
  function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
  function ym(date){return date.slice(0,7);}

  function renderRunway(){
    var cur=ym(today()),spent=0;
    data.expenses.forEach(function(e){if(ym(e.date)===cur)spent+=e.amount;});
    var fill=$('fill'),msg=$('msg');
    if(!data.budget){
      $('leftAmt').textContent=money(spent);
      $('leftLabel').textContent='spent this month. Set a budget to track what is left.';
      fill.style.width='0';msg.textContent='';return;
    }
    var left=data.budget-spent,pct=Math.min(100,spent/data.budget*100);
    $('leftAmt').textContent=money(Math.abs(left));
    $('leftLabel').textContent=left>=0?'left of '+money(data.budget)+' this month':'over your '+money(data.budget)+' budget this month';
    fill.style.width=pct+'%';
    if(left<0){fill.style.background='var(--bad)';msg.textContent='You crossed your monthly budget by '+money(-left)+'.';msg.style.color='var(--bad)';}
    else if(pct>=80){fill.style.background='var(--warn)';msg.textContent='You have used '+Math.round(pct)+'% of your budget. Spend carefully.';msg.style.color='var(--warn)';}
    else{fill.style.background='var(--ok)';msg.textContent='';}
  }

  function renderFilter(){
    var sel=$('monthFilter'),prev=sel.value||'all';
    var set={};data.expenses.forEach(function(e){set[ym(e.date)]=1;});
    var keys=Object.keys(set).sort().reverse();
    sel.innerHTML='<option value="all">All months</option>'+keys.map(function(k){return '<option value="'+k+'">'+k+'</option>';}).join('');
    sel.value=keys.indexOf(prev)>-1||prev==='all'?prev:'all';
  }

  function renderList(){
    var f=$('monthFilter').value;
    var list=data.expenses.filter(function(e){return f==='all'||ym(e.date)===f;})
      .sort(function(a,b){return a.date<b.date?1:-1;});
    var total=0;
    $('rows').innerHTML=list.map(function(e){
      total+=e.amount;
      return '<tr><td>'+e.date+'</td><td>'+esc(e.category)+'</td><td>'+esc(e.note||'')+'</td><td class="amt">'+money(e.amount)+
        '</td><td style="white-space:nowrap"><button class="ghost" data-edit="'+e.id+'">Edit</button> <button class="ghost del" data-del="'+e.id+'">Delete</button></td></tr>';
    }).join('');
    $('empty').style.display=list.length?'none':'block';
    $('total').textContent=money(total);
  }

  function bars(el,map,empty){
    var keys=Object.keys(map);
    if(!keys.length){el.innerHTML='<div class="empty">'+empty+'</div>';return;}
    var max=Math.max.apply(null,keys.map(function(k){return map[k];}));
    el.innerHTML=keys.map(function(k){
      return '<div class="bar"><span>'+esc(k)+'</span><div><div class="b" style="width:'+(map[k]/max*100)+'%"></div></div><span>'+money(map[k])+'</span></div>';
    }).join('');
  }

  function renderSummaries(){
    var c={},m={};
    data.expenses.forEach(function(e){c[e.category]=(c[e.category]||0)+e.amount;var k=ym(e.date);m[k]=(m[k]||0)+e.amount;});
    var cs={};Object.keys(c).sort().forEach(function(k){cs[k]=c[k];});
    var ms={};Object.keys(m).sort().forEach(function(k){ms[k]=m[k];});
    bars($('cats'),cs,'Category totals will show up here.');
    bars($('months'),ms,'Monthly totals will show up here.');
  }

  function render(){renderRunway();renderFilter();renderList();renderSummaries();}

  function resetForm(){
    editId=null;$('form').reset();$('date').value=today();
    $('formTitle').textContent='Add expense';$('saveBtn').textContent='Add expense';$('cancelBtn').style.display='none';
  }

  $('form').addEventListener('submit',function(ev){
    ev.preventDefault();
    var amount=parseFloat($('amount').value);
    if(!(amount>0)||!$('date').value)return;
    var item={id:editId||Date.now(),amount:amount,category:$('category').value,date:$('date').value,note:$('note').value.trim()};
    if(editId){data.expenses=data.expenses.map(function(e){return e.id===editId?item:e;});}
    else data.expenses.push(item);
    save();resetForm();render();
  });

  $('cancelBtn').addEventListener('click',resetForm);
  $('monthFilter').addEventListener('change',renderList);

  $('budgetBtn').addEventListener('click',function(){
    var b=parseFloat($('budgetInput').value);
    if(!(b>0)){$('msg').textContent='Enter a budget greater than 0.';$('msg').style.color='var(--bad)';return;}
    data.budget=b;save();renderRunway();
  });

  $('rows').addEventListener('click',function(ev){
    var t=ev.target,id;
    if(t.dataset.del){
      id=Number(t.dataset.del);
      if(confirm('Delete this expense?')){data.expenses=data.expenses.filter(function(e){return e.id!==id;});save();render();}
    }else if(t.dataset.edit){
      id=Number(t.dataset.edit);
      var e=data.expenses.filter(function(x){return x.id===id;})[0];
      if(!e)return;
      editId=id;$('amount').value=e.amount;$('category').value=e.category;$('date').value=e.date;$('note').value=e.note||'';
      $('formTitle').textContent='Edit expense';$('saveBtn').textContent='Save changes';$('cancelBtn').style.display='block';
      $('amount').focus();
    }
  });

  load();
  if(data.budget)$('budgetInput').value=data.budget;
  $('date').value=today();
  render();
})();
</script>
</body>
</html>
